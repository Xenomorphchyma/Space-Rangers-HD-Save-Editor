name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and run public tests
        shell: powershell
        run: .\tools\verify.ps1 -GamePath ''
      - name: Upload executable and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Space-Rangers-HD-Save-Editor
          path: |
            release/SRHDSaveEditor.exe
            release/manifest.json
